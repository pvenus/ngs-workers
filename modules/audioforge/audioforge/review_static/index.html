<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BGM 청취실 · AudioForge</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151c2b'/%3E%3Cpath d='M8 12v8m5-13v18m6-15v12m5-8v4' stroke='%2368e0bb' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="/review/style.css"><link rel="stylesheet" href="/review/listening.css"><script src="/review/app.js" defer></script></head>
<body><header><a class="brand" href="/review">AUDIOFORGE <span>청취실</span></a><span class="local">LOCAL MUSIC PLAYER</span></header>
<main><div class="heading"><div><p class="eyebrow">동양 판타지 · BGM COLLECTION</p><h1>여정의 소리를 듣다.</h1></div><button id="refresh" type="button">목록 새로고침</button></div>
<p id="summary" role="status" aria-live="polite">음원을 불러오는 중…</p><p id="error" role="alert" hidden></p>
<div class="review-controls"><label>비교군 <select id="group-select" aria-label="비교군 선택"></select></label><label>결정 <select id="decision-filter"><option value="visible">기본 목록</option><option value="rejected">거절됨</option><option value="all">전체</option></select></label><label>검색 <input id="track-search" type="search" placeholder="곡 이름 검색"></label><label>정렬 <select id="track-sort"><option value="original">원래 순서</option><option value="title">제목순</option></select></label></div>
<div class="workspace"><aside class="library" aria-label="음원 플레이어와 재생목록"><section class="now-playing"><div class="row"><p class="eyebrow">NOW PLAYING</p><span id="play-state" class="badge" role="status">곡 선택 전</span></div><div class="cover" aria-hidden="true"><span>♪</span><small>AUDIOFORGE ORIGINAL</small></div><h2 id="now-title">음원 불러오는 중</h2><p id="now-use" class="muted"></p><audio id="audio" controls preload="metadata" aria-label="선택한 곡 재생"></audio><div class="transport"><button id="previous" type="button" aria-label="이전 곡">← 이전 곡</button><span id="position" class="muted">—</span><button id="next" type="button" aria-label="다음 곡">다음 곡 →</button></div><dl id="audio-status" class="audio-status"></dl><a id="download" class="download" hidden download>WAV 다운로드</a><p id="player-error" class="uncertain" role="alert" hidden></p></section><section class="playlist-panel"><div class="row"><h2>재생목록</h2><span id="track-count" class="muted"></span></div><nav id="playlist" aria-label="재생할 곡 선택"></nav></section></aside>
<section id="detail-panel" class="detail-panel" aria-label="선택한 곡의 평가와 기획"><p class="muted">곡을 선택하면 평가와 기획이 표시됩니다.</p></section></div>
<footer>원본 음원 재생 · 기술 측정과 사용자 청취 평가는 별도입니다. 곡 승인은 최상위 업무 승인이나 게임 채택이 아닙니다.</footer></main></body></html>
