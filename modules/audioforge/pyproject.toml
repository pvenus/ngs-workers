[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioforge-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
audioforge-generation-api = "audioforge.api:main"
audioforge-catalog-api = "audioforge.gateway_service:main"
audioforge-review-api = "audioforge.review_api:main"

[tool.setuptools.packages.find]
include = ["audioforge*"]

[tool.setuptools.package-data]
audioforge = ["review_static/*", "hq_pins.json"]
