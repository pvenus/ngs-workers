name: Prepare NGS worker target readiness
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  target-source-readiness:
    if: github.repository == 'pvenus/ngs-workers' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Verify fixed targets without running project code
        run: python3 -B tools/release/prepare-targets.py "$RUNNER_TEMP/target-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-targets-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/target-proof/release.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14
